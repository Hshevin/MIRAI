[project]
name = "figure-detection"
version = "0.1.0"
description = "Privacy-first primary-person video anonymizer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=14.0",
  "fastapi>=0.116",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.34",
  "zstandard>=0.23",
]

[project.optional-dependencies]
vision = [
  "boxmot>=22.0",
  "torch>=2.7",
  "torchvision>=0.22",
  "ultralytics>=8.4.63",
]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
figure-detection-api = "figure_detection.api.app:run"
figure-detection-worker = "figure_detection.worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figure_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

